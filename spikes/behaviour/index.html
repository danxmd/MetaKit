<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaKit behaviour spike</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem 2rem;
        max-width: 60rem;
      }
      textarea {
        width: 100%;
        height: 11rem;
        font:
          13px/1.4 ui-monospace,
          monospace;
      }
      pre {
        background: #f1f3f5;
        padding: 0.6rem;
        overflow: auto;
      }
      .row {
        margin: 0.6rem 0;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      input[type='text'] {
        flex: 1;
        font:
          13px ui-monospace,
          monospace;
        padding: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Behaviour spike</h1>
    <h2>Formula</h2>
    <div class="row">
      <input
        id="formula"
        type="text"
        value="IF(priority == 'High', cost * qty, 0) + SUM(1, 2)"
      />
      <input
        id="scope"
        type="text"
        value='{"priority":"High","cost":40,"qty":3}'
      />
      <button id="evaluate">Evaluate</button>
    </div>
    <pre id="formula-out">–</pre>
    <h2>Script sandbox</h2>
    <p>
      QuickJS and the TypeScript compiler are fetched only when you press
      <strong>Load sandbox</strong>.
    </p>
    <div class="row">
      <button id="load">Load sandbox</button>
      <button id="run" disabled>Delete element el_1</button>
      <span id="status">not loaded</span>
    </div>
    <textarea id="script" spellcheck="false">
declare function on(name: string, fn: (p: { id: string }) => unknown): void;
declare function cancel(reason?: string): unknown;
declare const model: { get(id: string, key: string): unknown };

// A synchronous "before" handler: the delete only happens if nobody cancels.
on('before:deleteElement', (p) => {
  if (model.get(p.id, 'locked') === true) {
    return cancel('Locked elements cannot be deleted');
  }
});</textarea>
    <pre id="script-out">–</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
