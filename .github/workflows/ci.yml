name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Validate the sample Kits and models
        run: |
          for path in kits/bpmn-lite kits/er-lite kits/bpmn-lite/order-process.mkmodel.json kits/er-lite/library.mkmodel.json kits/data-ai-strategy kits/data-ai-maturity kits/kpi-metric-tree kits/data-mesh kits/data-modelling kits/data-modelling/retail-conceptual.mkmodel.json kits/data-modelling/retail-physical.mkmodel.json kits/data-pipelines-lineage kits/data-quality kits/master-data kits/analytics-bi kits/privacy-ropa kits/cloud-data-migration kits/ml-lifecycle kits/genai-solution kits/ai-risk-compliance kits/capability-map kits/business-model-canvas kits/value-streams-journeys kits/stakeholder-org-map kits/okrs-goals kits/project-raid kits/requirements-stories kits/decision-tables; do
            node apps/cli/dist/bin.js validate "$path" --strict
          done
          # These samples show warnings on purpose, so they are checked without --strict.
          for path in kits/data-ai-strategy/insurer-strategy.mkmodel.json kits/data-ai-maturity/maturity-2027.mkmodel.json kits/kpi-metric-tree/online-store.mkmodel.json kits/data-mesh/retail-data-mesh.mkmodel.json kits/data-modelling/retail-logical.mkmodel.json kits/data-pipelines-lineage/retail-sales-lineage.mkmodel.json kits/data-quality/bank-customer-data.mkmodel.json kits/master-data/manufacturer-mdm.mkmodel.json kits/analytics-bi/retail-analytics.mkmodel.json kits/privacy-ropa/hospital-records.mkmodel.json kits/cloud-data-migration/bank-migration.mkmodel.json kits/ml-lifecycle/churn-model.mkmodel.json kits/genai-solution/support-assistant.mkmodel.json kits/ai-risk-compliance/recruitment-register.mkmodel.json kits/capability-map/retailer-capabilities.mkmodel.json kits/business-model-canvas/bike-repair.mkmodel.json kits/value-streams-journeys/broadband-journey.mkmodel.json kits/stakeholder-org-map/finance-system.mkmodel.json kits/okrs-goals/library-okrs.mkmodel.json kits/project-raid/office-move.mkmodel.json kits/requirements-stories/appointment-booking.mkmodel.json kits/decision-tables/loan-approval.mkmodel.json; do
            node apps/cli/dist/bin.js validate "$path"
          done
      - name: Install Chromium
        run: pnpm --filter @metakit-app/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Canvas performance budget
        run: pnpm bench
      - name: Bundle-size report
        run: |
          raw=$(find apps/web/dist -type f -exec cat {} + | wc -c)
          gz=$(find apps/web/dist -type f -exec gzip -9 -c {} \; | wc -c)
          {
            echo "### Web app bundle size"
            echo
            echo "| | Bytes |"
            echo "| --- | --- |"
            echo "| Raw | $raw |"
            echo "| Compressed (gzip) | $gz |"
            echo
            echo "Budget: 1,500,000 bytes compressed (reported only until phase 2)."
          } >> "$GITHUB_STEP_SUMMARY"
